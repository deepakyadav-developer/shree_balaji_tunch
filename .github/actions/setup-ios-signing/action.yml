name: Setup iOS Signing
description: Installs certificates, provisioning profiles, configures manual signing and export options

inputs:
  certificate:
    description: Base64 encoded Apple certificate (.p12)
    required: true
  certificate-password:
    description: Certificate password
    required: true
  provisioning-profile:
    description: Base64 encoded main provisioning profile
    required: true
  provisioning-profile-ext:
    description: Base64 encoded extension provisioning profile
    required: false
  keychain-password:
    description: Keychain password
    required: true

outputs:
  cert-type:
    description: Detected certificate type (e.g., Apple Distribution)
    value: ${{ steps.detect_cert.outputs.cert_type }}

runs:
  using: composite
  steps:
    - name: ✍️ Setup Xcode Signing
      shell: bash
      env:
        CERTIFICATE: ${{ inputs.certificate }}
        CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
        PROVISIONING_PROFILE: ${{ inputs.provisioning-profile }}
        PROVISIONING_PROFILE_EXT: ${{ inputs.provisioning-profile-ext }}
        KEYCHAIN_PASSWORD: ${{ inputs.keychain-password }}
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        PP_PATH=$RUNNER_TEMP/temp.mobileprovision
        PP_EXT_PATH=$RUNNER_TEMP/temp_ext.mobileprovision

        echo -n "$CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
        echo -n "$PROVISIONING_PROFILE" | base64 --decode -o $PP_PATH
        
        if [ ! -z "$PROVISIONING_PROFILE_EXT" ]; then
          echo -n "$PROVISIONING_PROFILE_EXT" | base64 --decode -o $PP_EXT_PATH
        fi

        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db

        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

        UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PP_PATH))
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

        if [ ! -z "$PROVISIONING_PROFILE_EXT" ]; then
          UUID_EXT=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PP_EXT_PATH))
          cp $PP_EXT_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID_EXT.mobileprovision
        fi

        echo "Installed profiles:"
        ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

    - name: 🔑 Set Default Keychain & Detect Certificate
      id: detect_cert
      shell: bash
      run: |
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        security default-keychain -s $KEYCHAIN_PATH
        security unlock-keychain -p "${{ inputs.keychain-password }}" $KEYCHAIN_PATH
        security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

        CERT_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -o '"[^"]*"' | head -1 | tr -d '"')

        if [ -z "$CERT_IDENTITY" ]; then
          echo "ERROR: No valid codesigning identity found in keychain!"
          exit 1
        fi

        CERT_TYPE=$(echo "$CERT_IDENTITY" | sed 's/:.*//' | xargs)
        echo "Detected certificate type: $CERT_TYPE"
        echo "cert_type=$CERT_TYPE" >> $GITHUB_OUTPUT

    - name: 🔧 Force manual signing in project.pbxproj
      shell: bash
      run: |
        PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
        CERT_TYPE="${{ steps.detect_cert.outputs.cert_type }}"

        sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
        perl -pi -e "s/\"Apple Development\"/\"$CERT_TYPE\"/g" "$PBXPROJ"
        perl -pi -e "s/\"iPhone Developer\"/\"$CERT_TYPE\"/g" "$PBXPROJ"
        perl -pi -e "s/\"iPhone Distribution\"/\"$CERT_TYPE\"/g" "$PBXPROJ"
        perl -pi -e "s/\"Apple Distribution\"/\"$CERT_TYPE\"/g" "$PBXPROJ"
        perl -pi -e "s/\"iOS Distribution\"/\"$CERT_TYPE\"/g" "$PBXPROJ"
        
        # NOTE: Update YOUR_TEAM_ID_HERE with your Apple Developer Team ID
        sed -i '' 's/DEVELOPMENT_TEAM = ".*";/DEVELOPMENT_TEAM = YOUR_TEAM_ID_HERE;/g' "$PBXPROJ"
        perl -pi -e 's/^\s*PROVISIONING_PROFILE_SPECIFIER = ".*";\n//g' "$PBXPROJ"
        perl -pi -e 's/(PRODUCT_BUNDLE_IDENTIFIER = com\.sbt\.sbtunch;)/$1\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "YOUR_PROVISIONING_PROFILE_NAME";/g' "$PBXPROJ"

    - name: 🔧 Update GHAExportOptions.plist
      shell: bash
      run: |
        CERT_TYPE="${{ steps.detect_cert.outputs.cert_type }}"
        EXPORT_PLIST="ios/GHAExportOptions.plist"
        if [ -f "$EXPORT_PLIST" ]; then
          perl -pi -e "s|<string>Apple Distribution</string>|<string>$CERT_TYPE</string>|g" "$EXPORT_PLIST"
          perl -pi -e "s|<string>iOS Distribution</string>|<string>$CERT_TYPE</string>|g" "$EXPORT_PLIST"
          perl -pi -e "s|<string>iPhone Distribution</string>|<string>$CERT_TYPE</string>|g" "$EXPORT_PLIST"
        else
          echo "No GHAExportOptions.plist found, skipping."
        fi
