name: shreebalaji_tounch
description: Shree Balaji Tounch Application.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  get: ^4.6.6
  font_awesome_flutter: ^10.7.0
  share_plus: ^10.1.2
  flutter_local_notifications: ^18.0.1
  webview_flutter: ^4.10.0
  photo_view: ^0.15.0
  flutter_tts: ^4.2.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  googleapis_auth: ^1.6.0
  cached_network_image: ^3.4.1
  firebase_storage: ^12.3.6
  marquee: ^2.2.3
  fluttertoast: ^8.2.8
  uuid: ^4.5.1
  firebase_messaging: ^15.1.5
  firebase_core: ^3.8.1
  cloud_firestore: ^5.5.2
  carousel_slider: ^5.0.0
  lottie: ^3.2.0
  animated_digit: ^3.3.1
  screenshot: ^3.0.0
  flutter_launcher_icons: ^0.14.2
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  flutter_notification_channel: ^3.1.0
  flutter_carousel_slider: ^1.1.0
  html: ^0.15.4
  upgrader: ^11.3.0
  animate_do: ^3.3.4
  device_info_plus: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/playstore-icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/playstore-icon.png"
  min_sdk_android: 21


flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/gif/
    - assets/lotties/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
